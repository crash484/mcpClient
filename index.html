<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MCP Client</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    #chat { border: 1px solid #ccc; border-radius: 8px; height: 400px; overflow-y: auto; padding: 12px; margin-bottom: 12px; }
    .msg { margin: 8px 0; } .user { color: #0057b7; } .bot { color: #333; }
    input, button { padding: 8px; font-size: 14px; }
    #queryInput { width: calc(100% - 90px); }
  </style>
</head>
<body>
  <h2>MCP Chat Client</h2>

  <!-- Step 1: connect to an MCP server -->
  <div>
    <input id="serverUrl" placeholder="MCP server URL or script path" style="width:70%" />
    <button onclick="connect()">Connect</button>
    <span id="status" style="margin-left:8px;color:gray">Not connected</span>
  </div>
  <br />

  <!-- Step 2: chat -->
  <div id="chat"></div>
  <input id="queryInput" placeholder="Ask something..." onkeydown="if(event.key==='Enter') sendQuery()" />
  <button onclick="sendQuery()">Send</button>

  <script>
    async function connect() {
      const target = document.getElementById("serverUrl").value.trim();
      document.getElementById("status").textContent = "Connecting...";
      const res = await fetch("/connect", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ target }),
      });
      const data = await res.json();
      document.getElementById("status").textContent = res.ok ? "✅ " + data.message : "❌ " + data.error;
    }

    async function sendQuery() {
      const input = document.getElementById("queryInput");
      const query = input.value.trim();
      if (!query) return;
      addMessage("user", query);
      input.value = "";

      const res = await fetch("/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query }),
      });
      const data = await res.json();
      addMessage("bot", data.response ?? data.error);
    }

    function addMessage(role, text) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = (role === "user" ? "You: " : "Bot: ") + text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
